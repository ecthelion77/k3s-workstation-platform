{{- $root := . -}}
{{- if and .Values.sso.enabled (has "kubeblocks" .Values.disabledApps) (not (has "keycloak" .Values.disabledApps)) }}
{{- fail "sso.enabled needs kubeblocks (the keycloak database): do not disable it, or disable keycloak too" }}
{{- end }}
{{- if and .Values.matrix.enabled (not .Values.sso.enabled) }}
{{- fail "matrix.enabled needs sso.enabled: people sign in to the chat through the workstation SSO" }}
{{- end }}
{{- range .Values.apps }}
{{- if and (not (has .name $root.Values.disabledApps)) (or (not .requires) (index $root.Values .requires).enabled) }}
{{- $sso := and .ssoValues $root.Values.sso.enabled }}
{{- /* Hosts are chart defaults under workstation.internal; for another domain the app's
       domainValues (and ssoDomainValues when sso is on) are injected with {domain} replaced. */}}
{{- $dv := dict }}
{{- if ne $root.Values.domain "workstation.internal" }}
{{- $dv = deepCopy (.domainValues | default dict) }}
{{- if $sso }}
{{- $dv = mergeOverwrite $dv (deepCopy (.ssoDomainValues | default dict)) }}
{{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: {{ $root.Release.Namespace }}
  {{- if or .wave .compareOptions }}
  annotations:
    {{- with .wave }}
    argocd.argoproj.io/sync-wave: {{ . | quote }}
    {{- end }}
    {{- with .compareOptions }}
    argocd.argoproj.io/compare-options: {{ . }}
    {{- end }}
  {{- end }}
spec:
  project: {{ $root.Values.project | quote }}
  {{- if $root.Values.configRepoURL }}
  sources:
    - repoURL: {{ $root.Values.repoURL | quote }}
      targetRevision: {{ $root.Values.targetRevision | quote }}
      path: {{ .path | quote }}
      helm:
        valueFiles:
          {{- if $sso }}
          - {{ .ssoValues }}
          {{- end }}
          - $values/values/{{ .name }}.yaml
        ignoreMissingValueFiles: true
        {{- if $dv }}
        valuesObject:
          {{- toYaml $dv | replace "{domain}" $root.Values.domain | nindent 10 }}
        {{- end }}
    - repoURL: {{ $root.Values.configRepoURL | quote }}
      targetRevision: {{ $root.Values.configRepoRevision | quote }}
      ref: values
  {{- else }}
  source:
    repoURL: {{ $root.Values.repoURL | quote }}
    targetRevision: {{ $root.Values.targetRevision | quote }}
    path: {{ .path | quote }}
    {{- if or $sso $dv }}
    helm:
      {{- if $sso }}
      valueFiles:
        - {{ .ssoValues }}
      {{- end }}
      {{- if $dv }}
      valuesObject:
        {{- toYaml $dv | replace "{domain}" $root.Values.domain | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .namespace | quote }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    {{- with .retry }}
    retry:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    syncOptions:
      {{- toYaml (.syncOptions | default $root.Values.syncOptions) | nindent 6 }}
  {{- with .ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
